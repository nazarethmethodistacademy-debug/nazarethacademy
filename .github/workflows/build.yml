name: Build Desktop Installers

# Builds the Windows .exe, macOS .dmg, and Linux .AppImage on real
# Windows/Mac/Linux runners — no local Mac or Windows machine needed.
#
# Trigger it either by pushing to main, or manually from the Actions tab
# ("Run workflow" button) whenever you just want fresh installers without
# pushing a change.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows-installer
            path: release/*.exe
          - os: macos-latest
            script: dist:mac
            artifact: macos-installer
            path: release/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux-installer
            path: release/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
