name: Build Desktop Installers

# Builds the Windows .exe, macOS .dmg, and Linux .AppImage on real
# Windows/Mac/Linux runners — no local Mac or Windows machine needed.
#
# Trigger it either by pushing to main, or manually from the Actions tab
# ("Run workflow" button) whenever you just want fresh installers without
# pushing a change.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows-installer
            path: release/*.exe
          - os: macos-latest
            script: dist:mac
            artifact: macos-installer
            path: release/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux-installer
            path: release/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer
        uses: nick-fields/retry@v3
        with:
          # electron-builder downloads several large binaries from GitHub's
          # release hosting (Electron itself, NSIS, codesigning tools). That
          # hosting occasionally drops the connection mid-download ("EOF")
          # on GitHub's own runners — a network blip, not a real build
          # error — so retry a few times before actually giving up.
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm run ${{ matrix.script }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Build APK
        uses: nick-fields/retry@v3
        with:
          # Same reasoning as the desktop job — Gradle downloads several large
          # SDK/build-tool components on first run, which can hit a flaky
          # network blip on shared runners. Retry before giving up.
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
